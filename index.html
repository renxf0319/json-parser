<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSON 解析器 · 在线格式化 / 校验 / 树形视图</title>
<meta name="description" content="一个简洁、优雅、功能强大的 JSON 在线解析工具：格式化、压缩、校验、树形视图、语法高亮、复制与下载。" />
<script>
  // 提前应用已保存的主题（默认 light），避免首屏闪烁
  (function () {
    try {
      var t = localStorage.getItem("json-tool-theme") || "light";
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<style>
  /* 默认主题：白色（light） */
  :root {
    --bg: #f4f6fb;
    --bg-soft: #ffffff;
    --panel: rgba(15, 23, 42, 0.02);
    --panel-border: rgba(15, 23, 42, 0.08);
    --panel-border-strong: rgba(15, 23, 42, 0.16);
    --text: #1a2236;
    --text-dim: #50607d;
    --text-faint: #8492ad;
    --accent: #5b6dff;
    --accent-2: #0ea5a4;
    --accent-glow: rgba(91, 109, 255, 0.22);
    --t-key: #1d6fd6;
    --t-str: #0f9d6b;
    --t-num: #c2780a;
    --t-bool: #8b3ff0;
    --t-null: #64748b;
    --t-punc: #94a3b8;
    --shadow: 0 20px 50px -24px rgba(31, 41, 90, 0.35);
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    --radius: 16px;
    --radius-sm: 10px;
    --glow-1: rgba(91, 109, 255, 0.10);
    --glow-2: rgba(14, 165, 164, 0.08);
    --ok: #16a34a;
    --err: #e11d48;
    --warn: #d97706;
    --ok-glow: rgba(22, 163, 74, 0.16);
    --err-glow: rgba(225, 29, 72, 0.14);
    --mark-bg: rgba(217, 119, 6, 0.22);
    --mark-fg: #7c2d12;
  }

  :root[data-theme="dark"] {
    --bg: #0b0f1a;
    --bg-soft: #111726;
    --panel: rgba(255, 255, 255, 0.03);
    --panel-border: rgba(255, 255, 255, 0.08);
    --panel-border-strong: rgba(255, 255, 255, 0.14);
    --text: #e8edf6;
    --text-dim: #9aa7bd;
    --text-faint: #6b7890;
    --accent: #7c8cff;
    --accent-2: #4fd1c5;
    --accent-glow: rgba(124, 140, 255, 0.35);
    --ok: #4ade80;
    --err: #fb7185;
    --warn: #fbbf24;
    --ok-glow: rgba(74, 222, 128, 0.14);
    --err-glow: rgba(251, 113, 133, 0.14);
    /* JSON token colors */
    --t-key: #7cc4ff;
    --t-str: #6ee7b7;
    --t-num: #fbbf24;
    --t-bool: #c084fc;
    --t-null: #94a3b8;
    --t-punc: #7c8aa5;
    --shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
    --glow-1: rgba(124, 140, 255, 0.12);
    --glow-2: rgba(79, 209, 197, 0.10);
    --mark-bg: #fbbf24;
    --mark-fg: #1a1a1a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 85% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 500px at 5% 110%, var(--glow-2), transparent 55%),
      var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .wrap {
    width: min(1280px, 100%);
    margin: 0 auto;
    padding: 28px 24px 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px;
    border-radius: 13px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 24px -6px var(--accent-glow);
    color: #fff; font-weight: 800; font-size: 20px;
    font-family: var(--mono);
    flex-shrink: 0;
  }
  .brand h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.2px;
    font-weight: 700;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 11px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all .18s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--panel-border-strong); transform: translateY(-1px); }
  .icon-btn svg { width: 19px; height: 19px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(8px);
  }
  .tool-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .btn {
    appearance: none;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 15px;
    border-radius: 11px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all .16s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--panel-border-strong); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary {
    border: none;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 26px -10px var(--accent-glow);
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }

  .search {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--panel-border);
    background: var(--bg-soft);
    border-radius: 11px;
    padding: 0 12px;
    height: 38px;
  }
  .search input {
    border: none; background: transparent; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 13px;
    width: 150px;
  }
  .search svg { width: 15px; height: 15px; color: var(--text-faint); }

  /* ---------- Panes ---------- */
  .panes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    flex: 1;
    min-height: 420px;
  }
  .pane {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--panel-border);
    background: var(--bg-soft);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    min-height: 0;
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  .pane-title { font-size: 13px; font-weight: 700; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }
  .pane-tools { display: flex; gap: 6px; }

  .mini {
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 8px; cursor: pointer;
    transition: all .15s ease;
  }
  .mini:hover { color: var(--text); border-color: var(--panel-border-strong); }

  textarea#input {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.65;
    padding: 18px 18px;
    tab-size: 2;
  }
  textarea#input::placeholder { color: var(--text-faint); }

  .output {
    flex: 1;
    overflow: auto;
    padding: 16px 18px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.7;
    white-space: pre;
  }
  .output.empty { display: grid; place-items: center; color: var(--text-faint); font-family: var(--sans); font-size: 14px; text-align: center; }

  /* JSON syntax highlight */
  .tok-key { color: var(--t-key); }
  .tok-str { color: var(--t-str); }
  .tok-num { color: var(--t-num); }
  .tok-bool { color: var(--t-bool); }
  .tok-null { color: var(--t-null); }
  .tok-punc { color: var(--t-punc); }

  /* Tree view */
  .tree { white-space: normal; }
  .tree .node { position: relative; }
  .tree .row {
    display: flex; align-items: center;
    padding: 2px 6px;
    border-radius: 7px;
    cursor: default;
  }
  .tree .row:hover { background: var(--panel); }
  .tree .caret {
    width: 16px; height: 16px;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--text-faint);
    transition: transform .15s ease;
    flex-shrink: 0;
    font-size: 10px;
  }
  .tree .caret.empty { visibility: hidden; }
  .tree .node.collapsed > .children { display: none; }
  .tree .node.collapsed > .row .caret { transform: rotate(-90deg); }
  .tree .key { color: var(--t-key); }
  .tree .colon { color: var(--t-punc); margin: 0 6px 0 2px; }
  .tree .val-str { color: var(--t-str); }
  .tree .val-num { color: var(--t-num); }
  .tree .val-bool { color: var(--t-bool); }
  .tree .val-null { color: var(--t-null); }
  .tree .meta { color: var(--text-faint); font-style: italic; margin-left: 8px; font-size: 12px; }
  .tree .children { margin-left: 14px; border-left: 1px solid var(--panel-border); padding-left: 8px; }
  .tree .row mark { background: var(--mark-bg); color: var(--mark-fg); border-radius: 3px; padding: 0 1px; }

  /* Status bar */
  .statusbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--panel-border);
    background: var(--panel);
    font-size: 13px;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 600;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-faint); box-shadow: 0 0 0 4px rgba(255,255,255,0.04); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-glow); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 4px var(--err-glow); }
  .stat { color: var(--text-dim); }
  .stat b { color: var(--text); font-weight: 700; }
  .err-msg { color: var(--err); font-family: var(--mono); font-size: 12.5px; }
  .spacer { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--bg-soft);
    border: 1px solid var(--panel-border-strong);
    color: var(--text);
    padding: 11px 18px; border-radius: 12px;
    font-size: 13.5px; font-weight: 600;
    box-shadow: var(--shadow);
    opacity: 0; pointer-events: none;
    transition: all .25s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center; color: var(--text-faint); font-size: 12.5px;
    padding-top: 4px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Tabs in output header */
  .tabs { display: flex; gap: 4px; }
  .tab {
    font-size: 12.5px; font-weight: 600; color: var(--text-dim);
    padding: 5px 11px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
  }
  .tab.active { color: var(--text); background: var(--panel-border); border-color: var(--panel-border-strong); }

  @media (max-width: 880px) {
    .panes { grid-template-columns: 1fr; }
    .wrap { padding: 20px 14px 32px; }
    .search input { width: 110px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">{ }</div>
      <div>
        <h1>JSON 解析器</h1>

      </div>

        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>

  <div class="toolbar">

      </button>
      <button class="btn" id="btnMinify">

      </button>

        校验
      </button>
      <button class="btn ghost" id="btnSample">示例</button>
      <button class="btn ghost" id="btnClear">清空</button>
    </div>
    <div class="tool-group">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

  <div class="panes">

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const input = $("input");
  const output = $("output");
  const statusDot = $("statusDot");
  const statusText = $("statusText");
  const errMsg = $("errMsg");
  const searchInput = $("searchInput");

  let currentView = "code";   // code | tree
  let lastPretty = "";
  let lastData = null;
  let lastError = null;

  /* ---------- Theme ---------- */
  const themeToggle = $("themeToggle");
  const themeIcon = $("themeIcon");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    if (t === "light") {
      themeIcon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    } else {
      themeIcon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
    }
    try { localStorage.setItem("json-tool-theme", t); } catch (e) {}
  }
  let savedTheme = "light";
  try { savedTheme = localStorage.getItem("json-tool-theme") || "light"; } catch (e) {}
  applyTheme(savedTheme);
  themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(next);
  });

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  /* ---------- Parse with position ---------- */
  function parseJSON(text) {
    if (text.trim() === "") return { ok: false, empty: true };
    try {
      const data = JSON.parse(text);
      return { ok: true, data };
    } catch (e) {
      let line = null, col = null, pos = null;
      const pm = e.message.match(/position (\d+)/);
      if (pm) {
        pos = +pm[1];
        const before = text.slice(0, pos);
        const lines = before.split("\n");
        line = lines.length;
        col = lines[lines.length - 1].length + 1;
      }
      const lm = e.message.match(/line (\d+) column (\d+)/i);
      if (lm) { line = +lm[1]; col = +lm[2]; }
      return { ok: false, error: e.message, line, col, pos };
    }
  }

  /* ---------- Syntax highlight ---------- */
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function highlight(jsonStr) {
    let s = escapeHtml(jsonStr);
    s = s.replace(
      /("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g,
      (m) => {
        let cls = "tok-num";
        if (/^"/.test(m)) {
          cls = /:\s*$/.test(m) ? "tok-key" : "tok-str";
        } else if (/^(true|false)$/.test(m)) {
          cls = "tok-bool";
        } else if (m === "null") {
          cls = "tok-null";
        }
        return '<span class="' + cls + '">' + m + "</span>";
      }
    );
    return s;
  }

  /* ---------- Tree view ---------- */
  function typeOf(v) {
    if (v === null) return "null";
    if (Array.isArray(v)) return "array";
    return typeof v;
  }
  function valClass(t) {
    return { string: "val-str", number: "val-num", boolean: "val-bool", null: "val-null" }[t] || "val-str";
  }
  function renderValue(v) {
    const t = typeOf(v);
    if (t === "string") return '"' + escapeHtml(v) + '"';
    if (t === "null") return "null";
    if (t === "boolean") return String(v);
    if (t === "number") return String(v);
    return "";
  }

  function buildNode(key, value, isLast, depth) {
    const node = document.createElement("div");
    node.className = "node";
    const t = typeOf(value);
    const row = document.createElement("div");
    row.className = "row";

    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = "▼";

    const keySpan = document.createElement("span");
    keySpan.className = "key";
    if (key !== null) keySpan.textContent = key;

    if (t === "object" || t === "array") {
      const children = document.createElement("div");
      children.className = "children";
      const entries = t === "array"
        ? value.map((item, i) => [i, item])
        : Object.entries(value);
      entries.forEach(([k, v]) => {
        children.appendChild(buildNode(String(k), v, false, depth + 1));
      });
      const meta = document.createElement("span");
      meta.className = "meta";
      const count = entries.length;
      meta.textContent = (t === "array" ? "[ ] " : "{ } ") + count + (count === 1 ? " 项" : " 项");

      caret.classList.remove("empty");
      caret.addEventListener("click", (e) => {
        e.stopPropagation();
        node.classList.toggle("collapsed");
      });
      row.appendChild(caret);
      if (key !== null) row.appendChild(keySpan);
      row.appendChild(meta);
      node.appendChild(row);
      node.appendChild(children);
    } else {
      caret.className = "caret empty";
      const colon = document.createElement("span");
      colon.className = "colon";
      colon.textContent = ":";
      const val = document.createElement("span");
      val.className = valClass(t);
      val.textContent = renderValue(value);
      row.appendChild(caret);
      if (key !== null) {
        row.appendChild(keySpan);
        row.appendChild(colon);
      }
      row.appendChild(val);
      node.appendChild(row);
    }
    return node;
  }

  function renderTree(data) {
    const tree = document.createElement("div");
    tree.className = "tree";
    tree.appendChild(buildNode(null, data, true, 0));
    return tree;
  }

  /* ---------- Stats ---------- */
  function computeStats(obj) {
    let depth = 0, nodes = 0;
    (function walk(v, d) {
      nodes++;
      const t = typeOf(v);
      if (t === "object" || t === "array") {
        depth = Math.max(depth, d + 1);
        Object.values(v).forEach((c) => walk(c, d + 1));
      } else {
        depth = Math.max(depth, d);
      }
    })(obj, 0);
    return { depth, nodes };
  }

  /* ---------- Render output ---------- */
  function render() {
    if (lastError || lastData === null) {
      if (output.dataset.empty !== "1") {
        output.className = "output empty";
        output.textContent = "等待操作 — 在左侧粘贴 JSON 后点击「格式化」";
        output.dataset.empty = "1";
      }
      return;
    }
    output.dataset.empty = "0";
    if (currentView === "code") {
      output.className = "output";
      output.innerHTML = highlight(lastPretty);
    } else {
      output.className = "output";
      output.innerHTML = "";
      output.appendChild(renderTree(lastData));
    }
    applySearch();
  }

  /* ---------- Actions ---------- */
  function doFormat() {
    const text = input.value;
    const res = parseJSON(text);
    if (res.empty) { toast("输入为空"); return; }
    if (!res.ok) {
      lastData = null; lastError = res; lastPretty = "";
      setStatus(false, res);
      render();
      return;
    }
    lastError = null;
    lastData = res.data;
    lastPretty = JSON.stringify(res.data, null, 2);
    const st = computeStats(res.data);
    setStatus(true, null, st);
    render();
    toast("已格式化");
  }

  function doMinify() {
    const text = input.value;
    const res = parseJSON(text);
    if (res.empty) { toast("输入为空"); return; }
    if (!res.ok) { lastData = null; lastError = res; lastPretty = ""; setStatus(false, res); render(); return; }
    lastError = null;
    lastData = res.data;
    lastPretty = JSON.stringify(res.data);
    const st = computeStats(res.data);
    setStatus(true, null, st);
    render();
    toast("已压缩");
  }

  function doValidate() {
    const text = input.value;
    const res = parseJSON(text);
    if (res.empty) { toast("输入为空"); return; }
    if (res.ok) {
      lastData = res.data; lastError = null; lastPretty = JSON.stringify(res.data, null, 2);
      setStatus(true, null, computeStats(res.data));
      render();
      toast("校验通过 ✓");
    } else {
      lastData = null; lastError = res; lastPretty = "";
      setStatus(false, res);
      render();
      toast("校验未通过");
    }
  }

  function setStatus(ok, err, stats) {
    if (err) {
      statusDot.className = "dot err";
      let msg = "JSON 解析失败";
      if (err.line) msg += "（第 " + err.line + " 行" + (err.col ? "，第 " + err.col + " 列" : "") + "）";
      statusText.textContent = msg;
      errMsg.textContent = err.error || "";
    } else {
      statusDot.className = "dot ok";
      statusText.textContent = "解析成功 · 合法 JSON";
      errMsg.textContent = "";
    }
    const raw = input.value;
    const bytes = new Blob([raw]).size;
    $("statSize").innerHTML = "大小 <b>" + formatBytes(bytes) + "</b>";
    $("statChars").innerHTML = "字符 <b>" + raw.length.toLocaleString() + "</b>";
    if (stats) {
      $("statDepth").innerHTML = "最大深度 <b>" + stats.depth + "</b>";
      $("statKeys").innerHTML = "节点 <b>" + stats.nodes.toLocaleString() + "</b>";
    }
  }

  function formatBytes(b) {
    if (b < 1024) return b + " B";
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
    return (b / 1024 / 1024).toFixed(2) + " MB";
  }

  /* ---------- Copy / Download ---------- */
  function btnCopy() {
    if (!lastPretty) { toast("暂无可复制内容"); return; }
    navigator.clipboard.writeText(lastPretty).then(
      () => toast("已复制到剪贴板"),
      () => {
        const ta = document.createElement("textarea");
        ta.value = lastPretty; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); toast("已复制"); } catch (e) { toast("复制失败"); }
        document.body.removeChild(ta);
      }
    );
  }
  function btnDownload() {
    if (!lastPretty) { toast("暂无可下载内容"); return; }
    const blob = new Blob([lastPretty], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "formatted.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    toast("已下载 formatted.json");
  }

  /* ---------- Search (tree highlight) ---------- */
  function applySearch() {
    const q = searchInput.value.trim().toLowerCase();
    if (currentView !== "tree" || !q) return;
    const keys = output.querySelectorAll(".tree .key");
    keys.forEach((k) => {
      const txt = k.textContent;
      const lower = txt.toLowerCase();
      k.innerHTML = "";
      if (lower.includes(q)) {
        const idx = lower.indexOf(q);
        k.appendChild(document.createTextNode(txt.slice(0, idx)));
        const m = document.createElement("mark");
        m.textContent = txt.slice(idx, idx + q.length);
        k.appendChild(m);
        k.appendChild(document.createTextNode(txt.slice(idx + q.length)));
      } else {
        k.textContent = txt;
      }
    });
  }

  /* ---------- Expand / Collapse all ---------- */
  function setAllCollapsed(collapsed) {
    if (currentView !== "tree") { currentView = "tree"; syncTabs(); render(); }
    output.querySelectorAll(".tree .node").forEach((n) => {
      if (n.querySelector(".children")) n.classList.toggle("collapsed", collapsed);
    });
  }

  /* ---------- Tabs ---------- */
  function syncTabs() {
    document.querySelectorAll(".tab").forEach((t) => {
      t.classList.toggle("active", t.dataset.view === currentView);
    });
  }
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      currentView = tab.dataset.view;
      syncTabs();
      render();
    });
  });

  /* ---------- Sample ---------- */
  const SAMPLE = {
    "name": "JSON 解析器",
    "version": "1.0.0",
    "released": true,
    "stars": 1280,
    "tags": ["json", "formatter", "validator", "tree-view"],
    "author": { "name": "威猛将军", "email": "dev@example.com", "social": null },
    "features": {
      "format": true,
      "minify": true,
      "validate": true,
      "highlight": true,
      "tree": { "expandAll": true, "collapseAll": true, "search": true }
    },
    "metrics": [
      { "label": "解析速度", "value": "0.4ms" },
      { "label": "最大深度", "value": "无限制" },
      { "label": "数据隐私", "value": "纯本地" }
    ],
    "note": "将任意 JSON 粘贴到左侧即可体验。"
  };

  /* ---------- Bind events ---------- */
  $("btnFormat").addEventListener("click", doFormat);
  $("btnMinify").addEventListener("click", doMinify);
  $("btnValidate").addEventListener("click", doValidate);
  $("btnSample").addEventListener("click", () => {
    input.value = JSON.stringify(SAMPLE, null, 2);
    doFormat();
  });
  $("btnClear").addEventListener("click", () => {
    input.value = ""; lastData = null; lastError = null; lastPretty = "";
    setStatusIdle(); render(); input.focus();
  });
  $("btnCopy").addEventListener("click", btnCopy);
  $("btnDownload").addEventListener("click", btnDownload);
  $("btnExpandAll").addEventListener("click", () => setAllCollapsed(false));
  $("btnCollapseAll").addEventListener("click", () => setAllCollapsed(true));
  $("btnPaste").addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      input.value = text; doFormat();
    } catch (e) { toast("无法读取剪贴板，请手动粘贴"); }
  });
  $("btnUpload").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { input.value = reader.result; doFormat(); };
    reader.readAsText(f);
  });
  searchInput.addEventListener("input", () => {
    if (currentView !== "tree") { currentView = "tree"; syncTabs(); render(); }
    applySearch();
  });

  function setStatusIdle() {
    statusDot.className = "dot";
    statusText.textContent = "尚未解析";
    errMsg.textContent = "";
    $("statSize").innerHTML = "大小 <b>—</b>";
    $("statChars").innerHTML = "字符 <b>—</b>";
    $("statDepth").innerHTML = "最大深度 <b>—</b>";
    $("statKeys").innerHTML = "节点 <b>—</b>";
  }

  // Restore last input
  try {
    const saved = localStorage.getItem("json-tool-input");
    if (saved) { input.value = saved; doFormat(); }
  } catch (e) {}
  input.addEventListener("input", () => {
    try { localStorage.setItem("json-tool-input", input.value); } catch (e) {}
  });

  // Tabs / GitHub link placeholders (set after deploy)
  function setRepoUrl(url) {
    if (!url) return;
    $("githubLink").href = url;
    $("footGithub").href = url;
  }
  window.__setRepoUrl = setRepoUrl;
})();
</script>
</body>
</html>
